{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Welcome, {{ member.username }}</h1><p>Set your MPS password for {{ member.email }}.</p>{% if member.admin %}<p>You must set up authenticator MFA before using administration.</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Password<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="primary">Set password & continue</button></form></section>{% endblock %}
